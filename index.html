<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高校入試の読解問題を読む | JUKEN CAMP</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2d2820;--paper:#faf8f3;--paper2:#ede8de;--card:#fff;
  --accent:#4a7a9a;--gold:#9a7030;--red:#c04848;--sage:#5a8a6a;
  --shadow:rgba(40,35,25,.08)
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}

.splash{position:fixed;inset:0;background:linear-gradient(160deg,#e8eef4,#f8f5ee,#e4ecf0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;transition:opacity .8s,transform .8s}
.splash.h{opacity:0;transform:scale(1.03);pointer-events:none}
.sp1{font-family:'Zen Old Mincho',serif;font-size:clamp(1.5rem,4.5vw,2.8rem);color:var(--ink);letter-spacing:.2em;animation:rv 1.5s ease-out forwards;opacity:0;text-align:center;line-height:1.7}
.sp2{font-family:'Shippori Mincho',serif;color:var(--accent);font-size:clamp(.65rem,1.6vw,.85rem);letter-spacing:.3em;margin-top:1rem;animation:rv 1.5s ease-out .5s forwards;opacity:0}
.sp3{color:var(--gold);font-weight:900;font-size:.62rem;letter-spacing:.4em;margin-top:2rem;animation:rv 1.5s ease-out 1s forwards;opacity:0}
.sp-badge{margin-top:1.5rem;animation:rv 1.5s ease-out .8s forwards;opacity:0;display:flex;gap:.6rem;align-items:center}
.sp-badge span{font-size:.6rem;font-weight:700;letter-spacing:.15em;padding:.3rem .8rem;border-radius:20px}
.sp-badge .b1{background:rgba(196,72,72,.1);color:var(--red)}
.sp-badge .b2{background:rgba(74,122,154,.1);color:var(--accent)}
@keyframes rv{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}

header{background:#fff;padding:.7rem 1.2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 12px var(--shadow);border-bottom:1px solid rgba(0,0,0,.04)}
.htl{font-family:'Zen Old Mincho',serif;color:var(--ink);font-size:.92rem;letter-spacing:.06em;cursor:pointer}
.htl span{color:var(--accent)}
.hcamp{color:var(--gold);font-size:.52rem;font-weight:700;letter-spacing:.25em}
.hsr input{background:var(--paper);border:1px solid var(--paper2);border-radius:8px;padding:.4rem .8rem;color:var(--ink);font-size:.78rem;width:150px;font-family:inherit;outline:none;transition:border .2s}
.hsr input:focus{border-color:var(--accent)}
.hsr input::placeholder{color:#bbb}

.ml{max-width:900px;margin:0 auto;padding:1.5rem 1rem 5rem}
.hero{text-align:center;margin-bottom:2rem;padding:2.5rem 0 2rem}
.hero h1{font-family:'Zen Old Mincho',serif;font-size:clamp(1.3rem,3.8vw,2.1rem);font-weight:900;line-height:1.6;margin-bottom:.8rem;color:var(--ink)}
.hero p{font-size:.83rem;color:#8a7e72;line-height:2;max-width:580px;margin:0 auto}
.hero-badges{display:flex;justify-content:center;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.hb{font-size:.58rem;font-weight:700;letter-spacing:.12em;padding:.28rem .8rem;border-radius:20px}
.hb.story{background:rgba(196,72,72,.08);color:var(--red);border:1px solid rgba(196,72,72,.2)}
.hb.essay{background:rgba(74,122,154,.08);color:var(--accent);border:1px solid rgba(74,122,154,.2)}

.ct{display:flex;margin-bottom:1.5rem;background:var(--card);border-radius:10px;box-shadow:0 2px 10px var(--shadow)}
.ctb{flex:1;padding:.65rem 1rem;cursor:pointer;border:none;background:transparent;font-family:inherit;font-size:.72rem;font-weight:700;color:#bbb;transition:all .2s;text-align:center}
.ctb.a{color:#fff;background:var(--accent);border-radius:8px;margin:3px}
.ctb[data-c=story].a{background:var(--red)}

.sg{display:grid;gap:.85rem}
.sc{background:var(--card);border-radius:12px;padding:1.3rem 1.4rem;cursor:pointer;transition:all .25s;border-left:4px solid transparent;overflow:hidden;box-shadow:0 1px 6px var(--shadow)}
.sc:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(40,35,25,.12)}
.sc[data-c=story]{border-left-color:var(--red)}.sc[data-c=essay]{border-left-color:var(--accent)}
.sct{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.4rem}
.sct-meta{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.scn{font-family:'Zen Old Mincho',serif;font-size:1.1rem;font-weight:900;line-height:1.4}
.sco{font-size:.55rem;padding:.15rem .6rem;border-radius:12px;font-weight:600;white-space:nowrap}
.sc[data-c=story] .sco{background:rgba(192,72,72,.08);color:var(--red)}
.sc[data-c=essay] .sco{background:rgba(74,122,154,.08);color:var(--accent)}
.sch{font-size:.76rem;color:#aaa;line-height:1.5;margin-top:.3rem}
.sc-reason{font-size:.65rem;color:#999;margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--paper2);line-height:1.6}
.sc-reason strong{color:var(--accent);font-weight:700}
.sc[data-c=story] .sc-reason strong{color:var(--red)}

/* Reading view */
.rv{display:none;max-width:740px;margin:0 auto;padding:1.5rem 1rem 6rem}
.rv.a{display:block}
.bb{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:#aaa;cursor:pointer;padding:.5rem 0;margin-bottom:1rem;background:none;border:none;font-family:inherit;transition:color .2s}
.bb:hover{color:var(--ink)}

.rh{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--paper2)}
.rh h1{font-family:'Zen Old Mincho',serif;font-size:clamp(1.5rem,5vw,2.4rem);font-weight:900;line-height:1.4;margin-bottom:.3rem}
.rh .rau{font-size:.85rem;color:#aaa;margin-top:.5rem}
.rh-meta{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem}
.rh-cat{font-size:.6rem;padding:.2rem .7rem;border-radius:20px;font-weight:700}
.rh-cat.story{background:rgba(192,72,72,.08);color:var(--red)}
.rh-cat.essay{background:rgba(74,122,154,.08);color:var(--accent)}

/* あらすじ */
.stx{font-family:'Shippori Mincho',serif;font-size:.98rem;line-height:2.3;background:var(--card);padding:2rem 1.8rem;border-radius:12px;box-shadow:0 2px 12px var(--shadow);margin-bottom:2rem;position:relative}
.stx::before{content:'あらすじ・概要';position:absolute;top:-10px;left:20px;background:var(--accent);color:#fff;font-size:.52rem;padding:.2rem .8rem;border-radius:4px;letter-spacing:.15em;font-family:'Zen Kaku Gothic New',sans-serif}
.stx.story::before{background:var(--red)}

.sec{margin-bottom:2rem}
.sec-label{font-size:.58rem;font-weight:900;letter-spacing:.3em;margin-bottom:.8rem;padding-bottom:.3rem;display:inline-block}

/* Section 1: 入試に選ばれる理由 — gold */
.sec-why .sec-label{color:var(--gold);border-bottom:2px solid rgba(154,112,48,.25)}
.sec-why .sec-body{background:rgba(154,112,48,.04);padding:1.5rem 1.6rem;border-radius:12px;border-left:3px solid rgba(154,112,48,.3);font-family:'Shippori Mincho',serif;font-size:.95rem;line-height:2.2}
.sec-why .sec-body p{margin-bottom:1em}

/* Section 2: 入試が測ろうとしていること — blue/red */
.test-box{border-radius:12px;padding:1.5rem 1.6rem;margin-bottom:2rem;position:relative;overflow:hidden}
.test-box.essay-style{background:linear-gradient(135deg,rgba(74,122,154,.07),rgba(74,122,154,.02));border:1.5px solid rgba(74,122,154,.2)}
.test-box.story-style{background:linear-gradient(135deg,rgba(192,72,72,.07),rgba(192,72,72,.02));border:1.5px solid rgba(192,72,72,.2)}
.test-box-label{font-size:.58rem;font-weight:900;letter-spacing:.3em;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.test-box.essay-style .test-box-label{color:var(--accent)}
.test-box.story-style .test-box-label{color:var(--red)}
.test-box-label::before{content:'◆';font-size:.6rem}
.test-item{margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid rgba(0,0,0,.05)}
.test-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.test-item-q{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.72rem;font-weight:700;margin-bottom:.4rem;color:#888;letter-spacing:.05em}
.test-item-a{font-family:'Shippori Mincho',serif;font-size:.92rem;line-height:1.9;color:var(--ink)}

/* Section 3: 作品を読む核心 — blue/red */
.sec-key .sec-label{color:var(--accent);border-bottom:2px solid rgba(74,122,154,.25)}
.sec-key .sec-body{background:rgba(74,122,154,.04);padding:1.5rem 1.6rem;border-radius:12px;border-left:3px solid rgba(74,122,154,.25);font-family:'Shippori Mincho',serif;font-size:.95rem;line-height:2.2}
.sec-key .sec-body p{margin-bottom:1em}
.rv[data-c=story] .sec-key .sec-label{color:var(--red)}
.rv[data-c=story] .sec-key .sec-body{background:rgba(192,72,72,.04);border-left-color:rgba(192,72,72,.25)}

/* Section 4: 深い理解 — sage */
.di{background:linear-gradient(135deg,#f0f4f0,#e8eee8);border-radius:12px;padding:2rem 1.8rem;margin-bottom:2rem;position:relative;overflow:hidden;border:1px solid rgba(90,138,106,.15)}
.di::before{content:'';position:absolute;top:0;right:0;width:180px;height:180px;background:radial-gradient(ellipse,rgba(90,138,106,.07),transparent 70%);pointer-events:none}
.sec-deep-label{color:var(--sage);border-bottom:2px solid rgba(90,138,106,.25)}
.di p{font-family:'Shippori Mincho',serif;font-size:.95rem;line-height:2.2;position:relative;margin-bottom:1em;color:var(--ink)}

.snv{display:flex;gap:.8rem;margin-top:2rem}
.snv button{flex:1;padding:.9rem;background:var(--card);border:2px solid var(--paper2);border-radius:10px;cursor:pointer;font-family:inherit;font-size:.8rem;color:var(--ink);transition:all .2s;font-weight:600}
.snv button:hover{border-color:var(--accent);color:var(--accent)}
.snv button:disabled{opacity:.2;cursor:default;color:var(--ink);border-color:var(--paper2)}

@media(max-width:600px){
.stx{padding:1.4rem 1rem;font-size:.9rem}
.di{padding:1.4rem 1rem}
.sec-why .sec-body,.sec-key .sec-body,.test-box{padding:1rem .9rem}
.hsr input{width:115px;font-size:.72rem}
.ctb{font-size:.65rem;padding:.55rem .5rem}
}
</style>
</head>
<body>

<div class="splash" id="sp">
<div class="sp1">高校入試の読解問題を読む</div>
<div class="sp2">—— 解かなくても、作品がわかる ——</div>
<div class="sp3">JUKEN CAMP</div>
</div>

<header id="hd" style="display:none">
<div onclick="goBack()" style="cursor:pointer">
<div class="hcamp">JUKEN CAMP</div>
<div class="htl">高校入試の<span>読解問題</span>を読む</div>
</div>
<div class="hsr"><input type="text" placeholder="作品・作者を検索…" id="si" oninput="filt()"></div>
</header>

<main class="ml" id="ml" style="display:none">
<div class="hero">
<h1>入試に出た作品を<br>深く理解する</h1>
<p>全国の高校入試に登場した小説・論説文を厳選。<br>解き方ではなく「入試が何を問うているか」の本質。<br>読むほどに、どんな問題にも通じる力が育っていく。</p>
</div>
<div class="ct" id="ct"></div>
<div class="sg" id="sg"></div>
</main>
<div class="rv" id="rv"></div>

<script id="D" type="application/json">
[
  {
    "i":1,"c":"story","t":"永遠の出口","o":"森絵都",
    "st":"昭和40年代の大阪郊外に育つ少女・紀子の物語。小学生から中学生にかけて「永遠に続くと思ったものが必ず終わる」という発見を繰り返しながら成長していく。家族のドラマと自己探求が繊細に重なる成長小説の傑作。",
    "reason":"この作品が入試に選ばれるのは、「子どもが大人になっていく瞬間」を非常に精密に描いているからです。入試を受けているあなた自身も、今まさに似た瞬間を生きている。だから読んだときの「解像度」が高い。自分の体験と重ねながら読める作品は、感情の読み取りを問う入試に最適です。\n\nまた、森絵都の文章は「紀子の気持ちを直接説明しない」という特徴があります。「悲しかった」「不安だった」とは書かれず、行動や情景の描写の中に感情が潜んでいる。この「書かれていない感情を読み取る力」こそ、入試の小説問題が一貫してテストしていることです。",
    "test":[
      {"q":"入試が測ろうとしていること①","a":"直接書かれていない心情を、行動や情景の言葉から推測する力。「紀子はうつむいた」「窓の外を見ていた」という描写から、その時の内面を言葉にできるか。"},
      {"q":"入試が測ろうとしていること②","a":"「変化」を読み取る力。最初と後で、紀子の何がどう変わったのか。変化の「きっかけ」と「結果」を本文の言葉をつなげて説明できるか。"},
      {"q":"入試が測ろうとしていること③","a":"「なぜ」を問う力。紀子がある行動をとった「理由」は何か。表面の行動の裏にある気持ちを論理的に説明できるか。"}
    ],
    "key":"この物語の核心は「永遠だと信じていたものが終わる瞬間」の発見です。子どもの頃、誰しも「これはずっと続く」と信じているものがある。しかし何かのきっかけでそれが終わる——その「あれ、終わった」という感覚の正体を、森絵都は精密に描きます。\n\n特に見逃せないのは「紀子が本音を隠す場面」です。大人の視線を気にして言えないこと、内側では確かに何かを感じている——このギャップが物語のいたる所に仕掛けられています。表の言葉と内側の気持ちのズレを追うことが、この作品を読む最大のポイントです。",
    "deep":"森絵都の文章の特徴は「子どもの視点から書く」ことです。大人の解説を加えず、子どもが感じたままを言葉にする。だから読者は「ああ、そうだった」と自分の記憶を掘り起こしながら読める。過去の自分を思い出させる力——これが森絵都の文学の本質です。\n\n「出口」というタイトルが示すのは、子ども時代からの「出口」です。子どもでいることの楽さと窮屈さ、大人になることの自由と孤独、その境目を生きている少女の物語は、どんな時代に読んでも古びない。成長とは「永遠だと思っていたものに、一つひとつ出口を見つけること」だとこの作品は静かに語りかけます。"
  },
  {
    "i":2,"c":"story","t":"夏の庭","o":"湯本香樹実",
    "st":"死を見たことがない小学生三人組が、独居老人を観察することで「死と生」に向き合っていく物語。老人との交流を通して少年たちが成長する青春小説。人間の尊厳と命の重さを問いかける。",
    "reason":"「他者との出会いが自分を変える」という構造は、入試の小説問題で最も多く出るパターンです。この作品はその構造が非常に明快で、しかも変化のプロセスが丁寧に描かれている。「最初どう思っていたか」「何がきっかけで変わったか」「どう変わったか」という三段階の変化を追いやすい点が、出題者に選ばれる理由です。\n\nまた老人の「言葉より行動で伝える」スタイルは、入試が特に問いたい「書かれていないことを読む力」を引き出します。老人が黙ってすることの「意味」を読み取れるかどうかが、この作品の読解の核心です。",
    "test":[
      {"q":"入試が測ろうとしていること①","a":"「関係の変化」を読み取る力。少年たちが老人を「観察対象」から「人間」として見るようになる転換点はどこか。その変化を生んだ出来事は何かを説明できるか。"},
      {"q":"入試が測ろうとしていること②","a":"行動の「意図」を読み取る力。老人がある行動をとった「なぜ」は何か。直接語らない老人の気持ちを、行動描写から論理的に説明できるか。"},
      {"q":"入試が測ろうとしていること③","a":"「死」という重いテーマと少年たちの成長がどう結びついているかを理解する力。テーマを本文の具体的な場面と結びつけて説明できるか。"}
    ],
    "key":"物語を開く鍵は「少年たちが老人を見る目の変化」を一段ずつ追うことです。最初は「死を観察する」という好奇心から始まった関係が、老人の庭仕事を手伝い、食事を共にするうちに変わっていく。変化はある一場面で急に起きるのではなく、小さな積み重ねの結果です。\n\n入試では「変化の根拠」を本文から示すことが求められます。「気持ちが変わった」と言うだけでなく、「本文のここでの描写から、こう読み取れる」と説明できるかどうか。この「根拠を示す力」は全ての小説読解に共通する最重要スキルです。",
    "deep":"湯本香樹実がこの作品で描いたのは「死から学ぶ生き方」です。少年たちは死を見るために老人を観察し始めましたが、最終的に老人から「どう生きるか」を教わります。死と向き合うことで生の輪郭が鮮やかになる——この逆説が本質的な真実です。\n\n老人は言葉で「こうしろ」と教えません。しかし庭を一緒に作り、食事を共にし、日常の行為の中で「生きること」を体で示します。「言わないことで伝える」——この日本文学の伝統的な表現法が、読解問題の中心になっています。何かを「語らない」登場人物の気持ちを読む力は、あらゆる小説問題に通じます。"
  },
  {
    "i":3,"c":"story","t":"かがみの孤城","o":"辻村深月",
    "st":"学校に行けなくなった少女・こころが、鏡の中の不思議な城で出会う7人の中学生の物語。それぞれに傷を持つ少年少女が「願いをかなえる鍵」を探しながら互いを理解していく。現代の孤独と居場所を描く直木賞受賞作。",
    "reason":"「自分の居場所がない」という感覚は、入試を受ける中学三年生が最もリアルに感じているテーマのひとつです。出題者はこの「当事者性」を意識的に選んでいます。読んでいる自分自身の問題として読める作品は、心情の読み取りが深くなる。\n\nまたこの作品のこころは「感情を隠す」登場人物です。本当は怖い、本当は誰かと話したい——しかし言葉にできない。この「内と外のズレ」を読み取る力こそ、小説読解が一貫して問うていることです。こころが言葉を発しない場面の「沈黙の意味」を読む練習として、この作品は最適です。",
    "test":[
      {"q":"入試が測ろうとしていること①","a":"「逃げる場所」が「戻る力をくれる場所」に変わるという逆説的な変化を、具体的な場面と結びつけて説明できるか。"},
      {"q":"入試が測ろうとしていること②","a":"こころが心を開けなかった理由と、開けるようになったきっかけを、本文の言葉を根拠に説明できるか。"},
      {"q":"入試が測ろうとしていること③","a":"他者の痛みに気づくためには、まず自分の痛みを認める必要がある——この構造を、作中の具体的な場面から読み取れるか。"}

  for(var i=0;i<items.length;i++){
    var s=items[i];
    // カード用：reasonの最初の一文を抽出
    var firstSentence=s.reason.split("。")[0]+"。";
    h+="<div class='sc' data-c='"+s.c+"' onclick='showItem("+s.i+")'>";
    h+="<div class='sct'><div class='sct-meta'><span class='sco'>"+CN[s.c]+"</span></div>";
    h+="<div class='scn'>"+s.t+"</div></div>";
    if(s.o) h+="<div class='sch'>"+s.o+"</div>";
    h+="<div class='sc-reason'><strong>選ばれる理由：</strong>"+firstSentence+"</div>";
    h+="</div>";
  }
  e.innerHTML=h||"<div style='text-align:center;color:#bbb;padding:3rem;font-size:.85rem'>該当する作品がありません</div>";
}

function setC(c){cc=c;renderCT();renderList();}
function filt(){cc="all";renderCT();renderList();}

function fmt(t){
  if(!t)return"";
  var ps=t.split("\n\n"),h="";
  for(var i=0;i<ps.length;i++)h+="<p>"+ps[i]+"</p>";
  return h;
}

var _scrollY=0;
function showItem(id){
  _scrollY=window.scrollY;
  var s=null;
  for(var i=0;i<S.length;i++)if(S[i].i===id){s=S[i];break;}
  if(!s)return;
  document.getElementById("ml").style.display="none";
  var rv=document.getElementById("rv");
  rv.className="rv a";
  rv.setAttribute("data-c",s.c);

  var boxClass=s.c==="story"?"story-style":"essay-style";

  // testアイテムのHTML構築
  var testHtml="";
  for(var j=0;j<s.test.length;j++){
    testHtml+="<div class='test-item'>";
    testHtml+="<div class='test-item-q'>"+s.test[j].q+"</div>";
    testHtml+="<div class='test-item-a'>"+s.test[j].a+"</div>";
    testHtml+="</div>";
  }

  rv.innerHTML=""
  +"<button class='bb' onclick='goBack()'>← 一覧に戻る</button>"
  +"<div class='rh'>"
  +"<h1>"+s.t+"</h1>"
  +(s.o?"<div class='rau'>"+s.o+"</div>":"")
  +"<div class='rh-meta'><span class='rh-cat "+s.c+"'>"+CN[s.c]+"</span></div>"
  +"</div>"
  +"<div class='stx "+s.c+"'><p>"+s.st+"</p></div>"
  +"<div class='sec sec-why'><div class='sec-label'>この作品が入試に選ばれる理由</div><div class='sec-body'>"+fmt(s.reason)+"</div></div>"
  +"<div class='test-box "+boxClass+"'><div class='test-box-label'>入試がこの作品で測ろうとしていること</div>"+testHtml+"</div>"
  +"<div class='sec sec-key'><div class='sec-label'>作品を読む核心</div><div class='sec-body'>"+fmt(s.key)+"</div></div>"
  +"<div class='sec sec-deep'><div class='sec-label sec-deep-label'>深い理解のために</div><div class='di'>"+fmt(s.deep)+"</div></div>"
  +"<div class='snv'>"
  +"<button "+(id<=1?"disabled":"")+" onclick='showItem("+(id-1)+")'>← 前の作品</button>"
  +"<button "+(id>=S.length?"disabled":"")+" onclick='showItem("+(id+1)+")'>次の作品 →</button>"
  +"</div>";

  window.scrollTo(0,0);
}

function goBack(){
  document.getElementById("rv").className="rv";
  document.getElementById("ml").style.display="";
  requestAnimationFrame(function(){window.scrollTo(0,_scrollY);});
}

window.addEventListener("load",init);
</script>
</body>
</html>
